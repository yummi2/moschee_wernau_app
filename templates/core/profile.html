{% extends "base.html" %}
{% load static %}
{% block title %}Profil{% endblock %}
{% block content %}

<div class="app-page-frame profile-page mx-auto max-w-6xl px-4">
    <div class="app-content-card content-page-fill bg-white rounded-2xl flex justify-end items-start p-6">

        <div class="w-80 rounded-2xl justify-end p-6" dir="rtl" data-app-language-surface>
            <h2 class="text-xl font-semibold mb-4" data-app-ar="الملف الشخصي" data-app-de="Mein Profil">الملف الشخصي</h2>

            <div class="flex items-center gap-4 mb-6">
                <div class="profile-avatar-preview">
                    <img id="avatarPreview"
                         {% if profile.avatar %}src="{{ profile.avatar.url }}"{% else %}hidden{% endif %}
                         alt="صورة {{ request.user.username }}">
                    <span id="avatarFallback" {% if profile.avatar %}hidden{% endif %} aria-hidden="true">
                        {{ request.user.username|first|upper }}
                    </span>
                </div>
                <div class="text-sm text-gray-600">
                    {{ request.user.username }}
                </div>
            </div>

            <!-- FORMULAR START -->
            <form method="post" enctype="multipart/form-data" class=" space-y-2">
                {% csrf_token %}

                <!-- Blauer Button für Datei-Auswahl -->
                <div class="flex gap-3">
                    <label for="id_avatar"
                        class="inline-block px-4 py-2 rounded-lg bg-blue-600 text-white cursor-pointer hover:bg-blue-700">
                        <span data-app-ar="اختر صورة" data-app-de="Bild auswählen">اختر صورة</span>
                    </label>
                    <input type="file" id="id_avatar" name="avatar" accept="image/*" class="hidden">


                    <!-- Speichern (zuerst versteckt) -->
                    <button id="saveBtn"
                        class="px-4 py-2 rounded-lg bg-blue-600 text-white cursor-not-allowed opacity-50" disabled>
                        <span data-app-ar="حفظ" data-app-de="Speichern">حفظ</span>
                    </button>
                </div>
                <button type="submit" name="action" value="delete"
                    class="px-4 py-2 rounded-lg bg-red-600 text-white cursor-pointer hover:bg-red-700">
                    <span data-app-ar="حذف الصورة" data-app-de="Bild löschen">حذف الصورة</span>
                </button>
            </form>
             {% if profile.zeugnis_link %}
            <div class="mt-6 text-right" dir="rtl">
                <a href="{{ profile.zeugnis_link }}"
                target="_blank"
                class="text-blue-600 hover:underline font-semibold">
                    <span data-app-ar="شهادة الفصل الدراسي الأول" data-app-de="Zeugnis des ersten Schulhalbjahres">شهادة الفصل الدراسي الأول</span>
                </a>
            </div>
        {% endif %}

            <script>
                // Sobald ein Bild ausgewählt wird → Button aktivieren
                document.getElementById("id_avatar").addEventListener("change", function () {
                    const saveBtn = document.getElementById("saveBtn");
                    const preview = document.getElementById("avatarPreview");
                    const fallback = document.getElementById("avatarFallback");
                    if (this.files.length > 0) {
                        if (preview.dataset.previewUrl) URL.revokeObjectURL(preview.dataset.previewUrl);
                        const previewUrl = URL.createObjectURL(this.files[0]);
                        preview.src = previewUrl;
                        preview.dataset.previewUrl = previewUrl;
                        preview.removeAttribute("hidden");
                        fallback.hidden = true;
                        saveBtn.disabled = false;
                        saveBtn.classList.remove("cursor-not-allowed", "opacity-50");
                    } else {
                        saveBtn.disabled = true;
                        saveBtn.classList.add("cursor-not-allowed", "opacity-50");
                    }
                });
            </script>
        </div>
    </div>
    </div>
    {% endblock %}
